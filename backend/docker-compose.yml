services:
  dairy-api:
    container_name: dairy-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9002:8081"
    environment:
      - APP_ENV=production
      - APP_NAME=dairy
      - APP_MODE=prod
      - SERVER_PORT=8081

      - DB_DRIVER=${DB_DRIVER:-postgres}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-legendroot}
      - DB_PASS=${DB_PASSWORD:-l3g3ndaryHub}
      - DB_PASSWORD=${DB_PASSWORD:-l3g3ndaryHub}
      - DB_NAME=${DB_NAME:-dairy_db}
      # Required: a random secret, e.g. `openssl rand -hex 32`, in .env next
      # to this file. The API refuses to start with a weak or example value.
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}
      # Access tokens are short and renewed silently by the app; the session
      # ends after this long without using the app.
      - ACCESS_TOKEN_TTL=${ACCESS_TOKEN_TTL:-1h}
      - SESSION_IDLE_TIMEOUT=${SESSION_IDLE_TIMEOUT:-720h}

      # Apply pending database migrations when the container starts.
      - AUTO_MIGRATE=true

      - MAIL_HOST=smtp.gmail.com
      - MAIL_PORT=587
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_SENDER=${MAIL_SENDER}
      # The published Android app (mobile/scripts/release.sh), served at /app.
      - APP_RELEASES_DIR=/app/releases
    volumes:
      - ./releases:/app/releases:ro
    restart: unless-stopped
    networks:
      tigerforge-db:
        ipv4_address: 172.20.0.16
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8081/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  tigerforge-db:
    external: true
